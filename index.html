<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Q3 Skills Test</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background-color:#eef2f3;
font-family: Arial ;
}

.container{
margin-top:40px;
}

h1{
text-align:center;
}

</style>

</head>


<body>

<div class="container">

<h1><b>User Registration</b></h1>

<p>Please fill out the form to create an account.</p>

<div class="card p-4">

<label>Full Name</label>
<input type="text" id="name" class="form-control">

<label class="mt-2">Age</label>
<input type="number" id="age" class="form-control">

<label class="mt-2">Email</label>
<input type="email" id="email" class="form-control">

<label class="mt-2">Upload Profile Picture</label>
<input type="file" id="photo" class="form-control">


<button class="btn btn-success mt-3" onclick="registerUser()">
Submit
</button>

</div>


<h2 class="mt-4"><b>Registration Result</b></h2>

<p id="output"></p>
<img id="photoPreview" height="400px" width="300px">



</div>


<script>

function registerUser(){

// variables
var name = document.getElementById("name").value;
var age = Number(document.getElementById("age").value);
var email = document.getElementById("email").value;

//image preview
var file = document.getElementById("photo").files[0];
if (file){
var reader = new FileReader();
reader.onload = function(e){
document.getElementById("photoPreview").src = e.target.result;
}
reader.readAsDataURL(file);
}

// output
document.getElementById("output").innerHTML =
"Hello " + name +
"! Your registration is successful.<br>" ;

}

</script>


</body>
</html>
